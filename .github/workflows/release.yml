name: Release

# Publishes to PyPI when a version tag is pushed (git tag v0.2.0 && git push --tags).
# Needs a PyPI "trusted publisher" for this repository and workflow, with environment "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
