<select id="llm-kit-{{ setting.touchpoint|slugify }}-{{ setting.key|slugify }}" name="value"{% if not setting.editable %} disabled{% endif %}>
  <option value=""{% if setting.value is None %} selected{% endif %}>—</option>
  {% for option in setting.options %}{% if option.value %}<option value="{{ option.value }}"{% if option.value == setting.value %} selected{% endif %}>{{ option.label|default:option.value }}</option>{% else %}<option value="{{ option }}"{% if option == setting.value %} selected{% endif %}>{{ option }}</option>{% endif %}{% endfor %}
</select>
