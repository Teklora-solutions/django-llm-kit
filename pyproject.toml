[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-llm-kit"
version = "0.2.0"
description = "LangGraph and LangChain for Django: model policies, agents and subagents, tools from your models, a model catalogue, cost tracking, monitoring, and streaming APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jordan Mwinuka", email = "jordanmwinuka@gmail.com" }]
keywords = ["django", "langgraph", "langchain", "llm", "agents", "litellm", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "django>=5.0",
    "langgraph>=1.0",
    "langgraph-checkpoint>=4.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
]

[project.urls]
Homepage = "https://github.com/Teklora-solutions/django-llm-kit"
Documentation = "https://teklora-solutions.github.io/django-llm-kit/"
Changelog = "https://github.com/Teklora-solutions/django-llm-kit/blob/master/CHANGELOG.md"
Repository = "https://github.com/Teklora-solutions/django-llm-kit"
Issues = "https://github.com/Teklora-solutions/django-llm-kit/issues"

[project.optional-dependencies]
drf = ["djangorestframework>=3.15"]
channels = ["channels>=4.0"]
litellm = ["langchain-litellm>=0.6"]
crypto = ["cryptography>=42"]
otel = ["opentelemetry-api>=1.20"]
postgres = ["langgraph-checkpoint-postgres>=3.0", "psycopg-pool>=3.2", "psycopg[binary]>=3.2"]
all = ["djangorestframework>=3.15", "channels>=4.0", "langchain-litellm>=0.6", "cryptography>=42", "opentelemetry-api>=1.20"]
docs = ["mkdocs-material>=9.5"]
dev = [
    "djangorestframework>=3.15",
    "channels>=4.0",
    "langchain-litellm>=0.6",
    "cryptography>=42",
    "opentelemetry-sdk>=1.20",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg-pool>=3.2",
    "daphne>=4.0",
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_kit"]

[tool.hatch.build.targets.sdist]
include = ["src/llm_kit", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src", "."]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/llm_kit/migrations/*" = ["E501"]
